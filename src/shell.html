<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOOM — WebAssembly</title>
<link rel="stylesheet" href="doom.css">
</head>
<body>
<div id="frame">
  <h1>DOOM <span>· id Software's original engine, compiled to WebAssembly</span></h1>
  <canvas id="canvas" width="320" height="200" tabindex="0"></canvas>
  <p class="keys">
    Arrows — move/turn &nbsp;·&nbsp; Ctrl — fire &nbsp;·&nbsp; Space — use &nbsp;·&nbsp;
    Shift — run &nbsp;·&nbsp; 1-4 — weapons &nbsp;·&nbsp; Tab — map &nbsp;·&nbsp; Esc — menu
  </p>
  <p id="status">Loading WAD…</p>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      document.getElementById('status').textContent = t || 'Rip and tear.';
    }
  };
  window.addEventListener('load', function () {
    document.getElementById('canvas').focus();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
