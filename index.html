<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOOM.js</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="640" height="400"></canvas>
  <div id="overlay">
    <h1>DOOM<span>.js</span></h1>
    <p>Pure HTML / CSS / JS &mdash; no assets, no libraries</p>
    <p class="keys">
      WASD &mdash; move &nbsp;|&nbsp; Mouse / &larr;&rarr; &mdash; turn<br>
      Click / Ctrl &mdash; fire &nbsp;|&nbsp; E / Space &mdash; open doors<br>
      Find the glowing exit. Rip and tear.
    </p>
    <button id="start">ENTER THE GATE</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
