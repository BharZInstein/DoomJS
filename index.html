<!doctypehtml><html lang=en><head><meta charset=UTF-8><title>DOOM — WebAssembly</title><link href=doom.css rel=stylesheet></head><body><div id=frame><h1>DOOM <span>· id Software's original engine, compiled to WebAssembly</span></h1><canvas height=200 id=canvas tabindex=0 width=320></canvas><p class=keys>Arrows — move/turn  ·  Ctrl — fire  ·  Space — use  ·  Shift — run  ·  1-4 — weapons  ·  Tab — map  ·  Esc — menu</p><p id=status>Loading WAD…</p></div><script>var Module={canvas:document.getElementById("canvas"),print:function(n){console.log(n)},printErr:function(n){console.warn(n)},setStatus:function(n){document.getElementById("status").textContent=n||"Rip and tear."}};window.addEventListener("load",(function(){document.getElementById("canvas").focus()}))</script><script async src=index.js></script></body></html>
